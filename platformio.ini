[env:esp32-p4-wifi6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino

monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
upload_speed = 921600

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram = enabled

lib_ldf_mode = chain
lib_archive = false

lib_deps =
    https://github.com/pschatzmann/codec-alac.git
    https://github.com/pschatzmann/arduino-libhelix.git
    git+https://github.com/pschatzmann/arduino-audio-tools.git
    lvgl/lvgl@^9.3.0
    lovyan03/LovyanGFX
    bodmer/TJpg_Decoder

build_flags =
    -O2
    -D LV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=3
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -D CONFIG_FREERTOS_HZ=1000

    -D CONFIG_I2S_SCK_IO=13
    -D CONFIG_I2S_BCK_IO=12
    -D CONFIG_I2S_WS_IO=10
    -D CONFIG_I2S_DO_IO=9
    -D CONFIG_I2S_DI_IO=11
    -D CONFIG_I2S_GND_IO=-1
    -D CONFIG_I2S_VCC_IO=-1
    -D CONFIG_OUTPUT_SAMPLE_RATE_HZ=44100

    ; ST7796 + FT6336/FT5x06 display/touch
    -D TFT_SCLK=52
    -D TFT_MOSI=51
    -D TFT_MISO=31
    -D TFT_CS=30
    -D TFT_DC=29
    -D TFT_RST=28
    -D TFT_BL=3

    -D I2C_SDA=50
    -D I2C_SCL=49
    -D TOUCH_RST=5
    -D TOUCH_INT=4
    -D TOUCH_ADDR=0x38

    -D TFT_SD_CS=2

    -D TFT_HOR_RES=480
    -D TFT_VER_RES=320
    -D PANEL_ROTATION=3

    -D CONFIG_DEFAULT_AP_SSID=\"ESP32-AirPlay-Setup\"
    -D CONFIG_DEFAULT_AP_PASSWORD=\"12345678\"

    -I include
    -I src
    -I src/airplay2
    -I src/airplay2/audio
    -I src/airplay2/metadata
    -I src/airplay2/hap
    -I src/airplay2/network
    -I src/airplay2/plist
    -I src/airplay2/rtsp
    -I lib/Network/src

    ; ESP-Hosted SDIO private headers
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/drivers/transport/sdio"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/drivers/transport"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/drivers/serial"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/drivers/bt"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/drivers/power_save"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/api"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/api/include"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/api/priv"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/drivers/rpc/core"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/drivers/rpc/slaveif"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/drivers/rpc/wrap"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/drivers/transport/spi"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/drivers/transport/spi_hd"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/drivers/virtual_serial_if"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/port/esp/freertos/include"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/host/utils"

    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/common"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/common/log"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/common/mempool"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/common/mempool/include"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/common/proto"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/common/rpc"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/common/transport"
    -I"C:/Users/Alan/Documents/PlatformIO/Projects/esp-hosted-mcu-main/common/utils"

build_src_filter =
    +<*>
    -<airplay2/main.c>
    -<airplay2/network/wifi.c>
    -<airplay2/network/ethernet.c>
    -<airplay2/network/dns_server.c>
    -<airplay2/web_server.c>
    -<airplay2/display.c>
    -<airplay2/buttons.c>
    -<airplay2/led.c>